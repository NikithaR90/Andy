<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andy App | Smarter Property Tax Protests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#119822',
              'on-primary': '#FFFFFF',
              'primary-container': '#1E441E',
              'on-primary-container': '#E6FFE6',
              tertiary: '#2A7221',
              'andy-hover': '#2A7221',
              'andy-success': '#31CB00',
              'brand-deep': '#152614',
              surface: '#FFFFFF',
              'on-surface': '#111827',
              'surface-variant': '#F7F8FA',
              'on-surface-variant': '#374151',
              outline: '#E5E7EB',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(229, 231, 235, 0.5);
      }
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: #FFFFFF;
        color: #111827;
      }
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
      }
      .hero-gradient {
        background: linear-gradient(to bottom right, rgba(21, 38, 20, 0.95), rgba(17, 152, 34, 0.4));
      }
      .card-shadow {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }
      .floating {
        animation: floating 4s ease-in-out infinite;
      }
      @keyframes floating {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.474.0",
        "react-dom/": "https://esm.sh/react-dom@^19.0.0/",
        "react/": "https://esm.sh/react@^19.0.0/",
        "react": "https://esm.sh/react@^19.0.0"
      }
    }
    </script>
  </head>
  <body class="selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
  </body>
</html>
